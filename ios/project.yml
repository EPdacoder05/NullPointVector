name: NullPointGuard
options:
  bundleIdPrefix: com.nullpoint
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: KX3P7M3B6L
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "10"
  configs:
    Debug:
      API_BASE_URL: "http://127.0.0.1:8088"
    Release:
      API_BASE_URL: ""
      EXCLUDED_SOURCE_FILE_NAMES: PilotSecrets.swift

targets:
  NullPointGuard:
    type: application
    platform: iOS
    sources:
      - path: Sources/NullPointGuard
      - path: Sources/Shared
      - path: Assets.xcassets
        buildPhase: resources
      - path: LaunchScreen.storyboard
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NullPoint Guard
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        API_BASE_URL: "$(API_BASE_URL)"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nullpoint.guard
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_KEY_CFBundleDisplayName: NullPoint Guard
      INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Info.plist
    entitlements:
      path: Config/NullPointGuard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nullpoint.guard
    dependencies:
      - target: NullPointDirectory
        embed: true
      - target: NullPointSMSFilter
        embed: true

  NullPointDirectory:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NullPointDirectory
      - path: Sources/Shared
    info:
      path: Config/NullPointDirectory-Info.plist
      properties:
        CFBundleDisplayName: NullPoint Directory
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nullpoint.guard.directory
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Config/NullPointDirectory-Info.plist
    entitlements:
      path: Config/NullPointDirectory.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nullpoint.guard

  NullPointSMSFilter:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NullPointSMSFilter
      - path: Sources/Shared
    info:
      path: Config/NullPointSMSFilter-Info.plist
      properties:
        CFBundleDisplayName: NullPoint SMS Filter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nullpoint.guard.smsfilter
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Config/NullPointSMSFilter-Info.plist
    entitlements:
      path: Config/NullPointSMSFilter.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nullpoint.guard

schemes:
  NullPointGuard:
    build:
      targets:
        NullPointGuard: all
        NullPointDirectory: all
        NullPointSMSFilter: all
    run:
      config: Debug
    archive:
      config: Release
