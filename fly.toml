# NullPoint Signal Deck on Fly.io — app process only.
# Postgres + Redis: `fly postgres create` / Upstash or `fly redis create`, then
# `fly secrets set DATABASE_URL=... REDIS_URL=... JWT_SECRET_KEY=... SIGNUP_OPEN=true`
#
#   fly launch --no-deploy   # first time, accept this fly.toml
#   fly deploy
#   fly secrets set PUBLIC_BASE_URL=https://<app>.fly.dev
#
# I am not a telecom. This box is nginx-less: Fly's proxy hits uvicorn :8000.

app = "nullpoint-signal"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  USE_GUNICORN = "true"
  API_WORKERS = "1"
  ENABLE_MESSAGE_EMBEDDINGS = "0"
  BILLING_MOCK = "true"
  FORCE_HSTS = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
