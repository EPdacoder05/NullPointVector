name: Docker Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Hackbook / archive lab images were removed from the tree. Scan the product
# Dockerfile only. Report-only (exit-code 0) to match docker-hardening —
# flip exit-code to 1 when ready for a hard gate.

jobs:
  scan-main:
    name: Scan Main Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build main image
        run: docker build -t nullpointvector:main .

      - name: Scan main image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nullpointvector:main
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: 0
