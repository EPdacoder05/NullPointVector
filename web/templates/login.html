<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — NullPoint</title>
  <link rel="stylesheet" href="/static/app.css?v=20260820-arrow" />
</head>
<body class="auth-body" data-theme="deck">
  <div class="auth-shell">
    <div class="auth-brand">
      <div class="mark">N</div>
      <h1>NullPoint</h1>
    </div>
    <div class="card auth-card">
      <div class="hd"><h2>Sign in</h2></div>
      <div class="bd stack">
        {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
        {% set next_path = next or '/app/dashboard' %}
        {% set loop_id = 'login' %}
        {% set show_oauth_terms = false %}
        {% include "_oauth_buttons.html" %}
        <form id="login-form" method="post" action="/app/login" autocomplete="on">
          <input type="hidden" name="next" value="{{ next_path }}">
          <div class="fld">
            <label for="username">Username or email</label>
            <input id="username" name="username" class="input" required
                   autocomplete="username" inputmode="email"
                   value="{{ username or '' }}">
          </div>
          <div class="fld">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" class="input" required
                   autocomplete="current-password">
          </div>
          <button type="submit" class="btn">Continue</button>
        </form>

        <div class="auth-signup" aria-label="Create a new account">
          <span class="auth-signup-label">Need an account?</span>
          <a class="btn secondary auth-signup-btn" href="/app/signup?next={{ next_path|urlencode }}">Sign up</a>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>
