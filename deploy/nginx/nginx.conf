# Single-ingress reverse proxy for NullPoint (Signal Deck + FastAPI).
#
# Routing:
#   /app, /static, /api/, /health, /metrics, /docs, /redoc, /openapi.json -> FastAPI (:8000)
#   / -> 302 /app
#
# Both API and console live in the `app` container on port 8000.
# Public HTTPS in pilot: Tailscale Funnel / named tunnel -> :8088 (this proxy).
# Funnel terminates TLS; nginx listens on :80. Prefer inbound X-Forwarded-Proto
# (https) over $scheme (http) so browser Origin matches the allowlist.

worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream fastapi { server app:8000; }

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /app {
            proxy_pass http://fastapi;
            # $http_host keeps the client port (e.g. :8088). $host strips it and
            # breaks Origin checks for http://127.0.0.1:8088 vs Host 127.0.0.1.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503;
        }
        location /static {
            proxy_pass http://fastapi;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 30s;
        }
        location /api/ {
            proxy_pass http://fastapi;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503;
        }
        location = /health  {
            proxy_pass http://fastapi;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location = /metrics { proxy_pass http://fastapi; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
        location /docs       { proxy_pass http://fastapi; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
        location /redoc      { proxy_pass http://fastapi; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
        location = /openapi.json { proxy_pass http://fastapi; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }

        location = / { return 302 /app; }
        # Anything else -> console (no legacy Dash).
        location / {
            return 302 /app;
        }
    }
}
