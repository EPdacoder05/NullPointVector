# Single-ingress reverse proxy for the Yahoo_Phish stack.
#
# WHY: one public entry point in front of BOTH services (Dash UI + FastAPI).
# This is the same shape you deploy in the cloud — only the thing in front of
# nginx changes (ngrok on your laptop  →  a managed load balancer / k8s
# ingress-nginx in the cloud). The app never changes.
#
# Routing:
#   /api/, /health, /metrics, /docs, /redoc, /openapi.json  ->  FastAPI (:8000)
#   everything else (/, /assets, /_dash-*)                   ->  Dash UI (:8050)
#
# Both services live in the same `app` container, so upstreams share the host
# name `app` on different ports.

worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream dash_ui { server app:8050; }
    upstream fastapi { server app:8000; }

    # Shared proxy headers (preserve client info + original scheme for the app).
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        # Security headers (defense in depth — FastAPI also sets these).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # --- FastAPI surface (explicit prefixes so they don't fall through) ---
        location /api/ {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /health  { proxy_pass http://fastapi; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
        location = /metrics { proxy_pass http://fastapi; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
        location /docs       { proxy_pass http://fastapi; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
        # Premium console (server-rendered) + its static assets live on FastAPI.
        location /app    { proxy_pass http://fastapi; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
        location /static { proxy_pass http://fastapi; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
        location /redoc      { proxy_pass http://fastapi; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
        location = /openapi.json { proxy_pass http://fastapi; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

        # Premium console is the default entry point (legacy Dash remains on /dash).
        location = / { return 302 /app; }
        location /dash {
            proxy_pass http://dash_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }

        # --- Dash UI (legacy — use /dash) ---
        location /_dash {
            proxy_pass http://dash_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }
        location /assets {
            proxy_pass http://dash_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
