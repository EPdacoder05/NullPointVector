<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NullPoint</title>
  <meta name="description" content="NullPoint protects against phishing, smishing, and vishing in one protected workspace.">
  <style>
    :root {
      --ink: #0b100e;
      --text: #e8f0ea;
      --muted: #8fa398;
      --brass: #c4a574;
      --signal: #2ec27e;
      --line: #2a3a32;
      --font: "Avenir Next", "Futura", "Trebuchet MS", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--ink);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main { max-width: 36rem; }
    .mark {
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--brass);
      font-size: 0.75rem;
    }
    h1 {
      font-weight: 500;
      font-size: 2rem;
      margin: 0.75rem 0 1rem;
    }
    p { color: var(--muted); line-height: 1.5; }
    a.cta {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.7rem 1.2rem;
      color: var(--ink);
      background: var(--brass);
      text-decoration: none;
      border: 1px solid var(--line);
    }
    a.cta:hover { background: var(--signal); }
  </style>
</head>
<body>
  <main>
    <div class="mark">NullPoint</div>
    <h1>Identity-risk defense across every message.</h1>
    <p>NullPoint helps you spot phishing, smishing, and vishing before they become account loss. Signal Deck is a protected workspace for signed-in customers and operators.</p>
    <a class="cta" href="/app">Sign in to Signal Deck</a>
  </main>
</body>
</html>
